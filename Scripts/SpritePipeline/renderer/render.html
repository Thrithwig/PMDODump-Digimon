<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PMDO Phase 4 GLB Renderer</title>
  <style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }</style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
let size = Number(params.get('size') || 256);
let azimuth = Number(params.get('azimuth') || 0) * Math.PI / 180;
let time = Number(params.get('time') || 0);
let clipName = params.get('clip') || '';
let pixelSize = Number(params.get('pixels') || 40);
const settings = await (await fetch('/render-config.json')).json();
function fail(error) {
  const message=String(error?.stack||error);
  document.documentElement.dataset.error=message;
  return fetch('/geometry',{method:'POST',body:JSON.stringify({error:message})});
}
window.addEventListener('error',event=>fail(event.error||event.message));
window.addEventListener('unhandledrejection',event=>fail(event.reason));
const pupilMode = (settings.eye_mode || 'forward-pupil') === 'forward-pupil';

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff4df, 0x33445a, 2.1));
const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(3, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb8ff, 1.2);
fill.position.set(-4, 2, -3);
scene.add(fill);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 1000);
camera.up.set(0, 1, 0);

async function finish(model, animations) {
  const clip = animations.find(item => item.name === clipName);
  if (!clip) throw new Error(`Missing requested animation: ${clipName}`);
  const mixer = new THREE.AnimationMixer(model);
  const action = mixer.clipAction(clip);
  action.reset().play();
  try {
  // Explicit source-atlas expression selection, never synthesized eye art.
  // Reset every job so persistent Sleep renders cannot leak into other clips.
  const eyeOffset = settings.native_eye_expression_offsets?.[clip.name] || [0, 0];
  if (!Array.isArray(eyeOffset) || eyeOffset.length !== 2 || !eyeOffset.every(Number.isFinite))
    throw new Error('native_eye_expression_offsets requires finite UV offset[2]');
  model.traverse(object => {
    for (const entry of object.userData.nativeExpressionMaps || [])
      entry.map.offset.set(entry.base[0] + eyeOffset[0], entry.base[1] + eyeOffset[1]);
  });
  const box = new THREE.Box3().setFromObject(model);
  let posedRadius = 0;
  if (settings.framing) {
    box.makeEmpty();
    for (const sample of settings.framing.sample_times) {
      mixer.setTime(sample); model.updateMatrixWorld(true);
      model.traverse(object => {
        if (!object.isMesh || !object.visible) return;
        if(object.skeleton) object.skeleton.update();
        for(let i=0;i<object.geometry.attributes.position.count;i++) {
          const point=new THREE.Vector3();object.getVertexPosition(i,point);
          point.applyMatrix4(object.matrixWorld);box.expandByPoint(point);
          posedRadius=Math.max(posedRadius,Math.hypot(point.x,point.z));
        }
      });
    }
  }
  const center = box.getCenter(new THREE.Vector3());
  if(settings.framing){center.x=0;center.z=0;}
  // A reviewed species camera can be reused across clips without refitting.
  const fixed = settings.fixed_framing;
  if (fixed) {
    if (!Array.isArray(fixed.center) || fixed.center.length !== 3 ||
        !fixed.center.every(Number.isFinite) || !Number.isFinite(fixed.extent) || fixed.extent <= 0)
      throw new Error('fixed_framing requires a finite center[3] and positive extent');
    center.fromArray(fixed.center);
  }
  const extent = fixed ? fixed.extent : settings.framing
    ? Math.max(posedRadius,(box.max.y-box.min.y)/2) * (settings.framing.margin || 1.2)
    : Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z) * 0.62;
  camera.left = -extent;
  camera.right = extent;
  camera.top = extent;
  camera.bottom = -extent;
  const distance = Math.max(20,extent*4);
  camera.near = distance - extent * 2;
  camera.far = distance + extent * 2;
  camera.position.set(Math.sin(azimuth) * distance + center.x, center.y + distance * (settings.elevation || 0.001*extent), Math.cos(azimuth) * distance + center.z);
  camera.lookAt(center.x, center.y, center.z);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);

  // Optional clip-specific in-place root travel. Horizontal locking is the
  // default; an explicit axes list may also suppress pathological vertical
  // root translation while retaining rotations, scale and child deformation.
  const rootLock = settings.horizontal_root_lock?.[clip.name];
  let rootMotion;
  let lockBone;
  let referencePosition;
  if (rootLock) {
    lockBone = model.getObjectByName(rootLock.bone);
    const referenceClip = rootLock.reference_clip
      ? animations.find(item => item.name === rootLock.reference_clip) : clip;
    if (!lockBone || !referenceClip || !Number.isFinite(rootLock.reference_time)
        || rootLock.reference_time < 0 || rootLock.reference_time > referenceClip.duration)
      throw new Error('horizontal_root_lock requires an existing bone and valid reference_time');
    if (referenceClip !== clip) {
      action.stop();
      mixer.stopAllAction();
      mixer.setTime(0);
      mixer.clipAction(referenceClip).reset().play();
    }
    mixer.setTime(rootLock.reference_time);
    referencePosition = lockBone.position.clone();
    if (referenceClip !== clip) {
      mixer.stopAllAction();
      mixer.setTime(0);
      action.reset().play();
    }
  }
  mixer.setTime(time);
  if (rootLock) {
    const axes = rootLock.axes || ['x', 'z'];
    if (!Array.isArray(axes) || !axes.length || axes.some(axis => !['x', 'y', 'z'].includes(axis)))
      throw new Error('horizontal_root_lock axes must contain only x, y, or z');
    const nativePosition = lockBone.position.toArray();
    for (const axis of axes) lockBone.position[axis] = referencePosition[axis];
    rootMotion = {bone:rootLock.bone,referenceClip:rootLock.reference_clip || clip.name,
      referenceTime:rootLock.reference_time,
      nativePosition,lockedPosition:lockBone.position.toArray(),axes};
  }
  model.updateMatrixWorld(true);
  const bonePoints={};
  for(const [marker,anchor] of Object.entries(settings.offset_bones || {})) {
    const name = typeof anchor === 'string' ? anchor : anchor.bone;
    const bone=model.getObjectByName(name);
    if(!bone)throw new Error(`Missing offset bone ${name}`);
    let p;
    if (typeof anchor === 'string') p=bone.getWorldPosition(new THREE.Vector3());
    else {
      if (!Array.isArray(anchor.local_point) || anchor.local_point.length !== 3 || !anchor.local_point.every(Number.isFinite))
        throw new Error(`Invalid local body point for ${marker}`);
      p=bone.localToWorld(new THREE.Vector3().fromArray(anchor.local_point));
    }
    p.project(camera);
    bonePoints[marker]=[(p.x+1)/2,(1-p.y)/2];
  }
  renderer.render(scene, camera);
  // An unlit surface-normal/depth pass captures the animated geometry, not
  // texture color. Pixel conversion uses it for arm/head/body separation.
  const target = new THREE.WebGLRenderTarget(pixelSize, pixelSize);
  const normals = new Uint8Array(pixelSize * pixelSize * 4);
  const depth = new Uint8Array(pixelSize * pixelSize * 4);
  const normalMaterial = new THREE.MeshNormalMaterial({side: THREE.DoubleSide});
  const depthMaterial = new THREE.MeshDepthMaterial({side: THREE.DoubleSide, depthPacking: THREE.BasicDepthPacking});
  renderer.setRenderTarget(target);
  scene.overrideMaterial = normalMaterial;
  renderer.clear();
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(target, 0, 0, pixelSize, pixelSize, normals);
  scene.overrideMaterial = depthMaterial;
  renderer.clear();
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(target, 0, 0, pixelSize, pixelSize, depth);
  scene.overrideMaterial = null;
  // Exclude the head/jaw from generic crease detection. Their small curved
  // surfaces need texture-authored mouth/nostril detail, not mesh faceting.
  const headPixels = new Uint8Array(pixelSize * pixelSize * 4);
  const saved = [];
  model.traverse(object => {
    if (!object.isMesh) return;
    saved.push([object, object.material]);
    object.material = object.userData.headMaskMaterial;
  });
  renderer.clear();
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(target, 0, 0, pixelSize, pixelSize, headPixels);
  for (const [object, material] of saved) object.material = material;
  // Visible eye masks provide stable pupil positions even at 40px resolution.
  const eyeTarget = new THREE.WebGLRenderTarget(size, size);
  const maskPixels = new Uint8Array(size * size * 4);
  const originalMaterials = [];
  const maskMaterials = [
    new THREE.MeshBasicMaterial({color: 0x000000, side: THREE.DoubleSide}),
    new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide}),
    new THREE.MeshBasicMaterial({color: 0x00ff00, side: THREE.DoubleSide}),
  ];
  model.traverse(object => {
    if (!object.isMesh) return;
    originalMaterials.push([object, object.material]);
    object.material = maskMaterials[(pupilMode || settings.source_eye_masks) ? (object.name === 'eye_L' ? 1 : object.name === 'eye_R' ? 2 : 0) : 0];
  });
  renderer.setRenderTarget(eyeTarget);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(eyeTarget, 0, 0, size, size, maskPixels);
  for (const [object, material] of originalMaterials) object.material = material;
  const eyes = [];
  for (let channel = 0; channel < 2; channel++) {
    let count = 0, sx = 0, sy = 0, minX = size, minY = size, maxX = 0, maxY = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      if (maskPixels[i + channel] < 200) continue;
      const py = size - 1 - y;
      count++; sx += x; sy += py;
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, py); maxY = Math.max(maxY, py);
    }
    if (count >= 5) {
      const eye = model.getObjectByName(channel === 0 ? 'eye_L' : 'eye_R');
      const point = new THREE.Vector3();
      if (pupilMode) {
        eye.getVertexPosition(eye.userData.pupilVertex, point);
        point.applyMatrix4(eye.matrixWorld).project(camera);
      }
      const pupil = pupilMode ? [(point.x + 1) / 2, (1 - point.y) / 2] : [sx/count/size, sy/count/size];
      const coverage = new Array(pixelSize * pixelSize).fill(0);
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (maskPixels[(y*size+x)*4+channel] < 200) continue;
        coverage[Math.floor((size-1-y)*pixelSize/size)*pixelSize+Math.floor(x*pixelSize/size)]++;
      }
      eyes.push({center: [sx/count/size, sy/count/size], pupil, coverage,
        ...(!pupilMode ? {sourceOnly:true} : {}),
        bounds: [minX/size, minY/size, (maxX+1)/size, (maxY+1)/size], pixels: count});
    }
  }
  // Render only source-texture mouth and nostril markings, depth-tested.
  for (const [object] of originalMaterials) object.material = object.userData.faceFeatureMaterial;
  renderer.clear();
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(eyeTarget, 0, 0, size, size, maskPixels);
  // Preserve the exact per-output-pixel source-feature coverage instead of
  // serializing the full high-resolution RGBA mask. At 1024/1536 captures the
  // old payload was tens of MB per frame even though assembly immediately
  // reduced it to the PMDO cell grid.
  const faceCoverage = new Array(pixelSize * pixelSize * 2).fill(0);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const source = (y * size + x) * 4;
    const target = (Math.floor((size - 1 - y) * pixelSize / size) * pixelSize
      + Math.floor(x * pixelSize / size)) * 2;
    faceCoverage[target] += maskPixels[source];
    faceCoverage[target + 1] += maskPixels[source + 1];
  }
  for (const [object, material] of originalMaterials) object.material = material;
  eyeTarget.dispose();
  maskMaterials.forEach(material => material.dispose());
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  target.dispose();
  normalMaterial.dispose();
  depthMaterial.dispose();
  await fetch('/geometry', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({size: pixelSize, normals: Array.from(normals), depth: Array.from(depth),
      headMask: Array.from(headPixels), faceCoverage, eyes, bonePoints,
      ...(rootMotion ? {rootMotion} : {}),
      framing:{center:center.toArray(),extent,clip:clip.name,duration:clip.duration}})});
  } finally {
    scene.overrideMaterial = null;
    renderer.setRenderTarget(null);
    model.traverse(object => { if (object.isMesh && object.userData.beautyMaterial) object.material = object.userData.beautyMaterial; });
    action.stop();
    mixer.stopAllAction();
    mixer.uncacheRoot(model);
  }
}

const loader = new GLTFLoader();
loader.load('/model.glb', async gltf => {
  const model = gltf.scene;
  // Opt-in DSTS layered-eye interpretation. Raw e01h RGB is white; its
  // ALPHA stores view-space shine, not opaque sclera. Keep legacy output
  // unchanged unless explicitly enabled after a species material audit.
  const nativeEyeTextures = new Map();
  if (settings.native_eye_layers === true) {
    const indices = new Set();
    model.traverse(object => {
      const source = object.material?.userData?.dsts;
      if (!source) return;
      for (const slot of ['InnerGrowAValue','OverlayNormalSampler','OverlayMaskSampler3','OverlayMaskSampler']) {
        const index = source.texture_indices?.[slot];
        if (Number.isInteger(index)) indices.add(index);
      }
    });
    await Promise.all([...indices].map(async index => nativeEyeTextures.set(index, await gltf.parser.getDependency('texture', index))));
  }
  model.traverse(object => {
    if (object.isMesh) {
      const nativeEyeSource = settings.native_eye_layers === true ? object.material?.userData?.dsts : null;
      const originalColor = object.geometry.attributes.color;
      if (nativeEyeSource?.texture_slots?.InnerGrowAValue && originalColor?.itemSize === 4) {
        object.geometry.setAttribute('sourceEyeOpacity', new THREE.Float32BufferAttribute(
          Array.from({length:originalColor.count}, (_,i)=>originalColor.getW(i)), 1));
      }
      if (/^outline(?:_\d+)?$/.test(object.name)) object.visible = false;
      object.frustumCulled = false;
      const color = new Float32Array(object.geometry.attributes.position.count * 3);
      const joints = object.geometry.attributes.skinIndex;
      const weights = object.geometry.attributes.skinWeight;
      for (let i=0; i<object.geometry.attributes.position.count; i++) {
        let headWeight=0;
        if (joints && weights) for (let j=0;j<4;j++) {
          const name=object.skeleton?.bones[joints.getComponent(i,j)]?.name;
          if ((settings.head_bones || ['J_head','J_joe']).includes(name)) headWeight+=weights.getComponent(i,j);
        }
        color[i*3]=color[i*3+1]=color[i*3+2]=headWeight > 0.5 ? 1 : 0;
      }
      object.geometry.setAttribute('color',new THREE.BufferAttribute(color,3));
      object.userData.headMaskMaterial = new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
      // Do not allow the diagnostic vertex color to affect beauty materials.
      const black = new THREE.MeshBasicMaterial({color:0x000000,side:THREE.DoubleSide});
      object.userData.faceFeatureMaterial = black;
      const sourceMap = object.material.map;
      if (sourceMap && sourceMap.name === 'chr050a01') {
        const canvas=document.createElement('canvas');
        canvas.width=canvas.height=1024;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(sourceMap.image,0,0,1024,1024);
        const pixels=ctx.getImageData(0,0,1024,1024);
        for(let y=0;y<1024;y++) for(let x=0;x<1024;x++) {
          const i=(y*1024+x)*4;
          const mouth=x<402 && y>265 && y<328 && pixels.data[i+1]<145 && pixels.data[i]<202;
          const nose=x>60 && x<90 && y>212 && y<240 && pixels.data[i+1]<115;
          pixels.data[i]=mouth?255:0;pixels.data[i+1]=nose?255:0;pixels.data[i+2]=0;pixels.data[i+3]=255;
        }
        ctx.putImageData(pixels,0,0);
        // Follow the existing closed-mouth seam in chr050a01 UV space.
        // Widen only the diagnostic mask to retain it at sprite resolution.
        ctx.strokeStyle='#ff0000';ctx.lineWidth=8;ctx.lineJoin='round';
        ctx.beginPath();
        [[18,319],[75,317],[135,314],[195,308],[255,305],[310,302],
         [337,296],[354,283],[372,275],[395,276]].forEach(([x,y],i)=>{
          if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
        });
        ctx.stroke();
        const map=new THREE.CanvasTexture(canvas);map.flipY=false;
        object.userData.faceFeatureMaterial=new THREE.MeshBasicMaterial({map,side:THREE.DoubleSide});
      }
      if (pupilMode && (object.name === 'eye_L' || object.name === 'eye_R')) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 128;
        const context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, 128, 128);
        // Pupils are rasterized from a forward point on each animated eye.
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.flipY = false;
        const uv = object.geometry.attributes.uv;
        const positions=object.geometry.attributes.position;
        const eyeBox=new THREE.Box3().setFromBufferAttribute(positions);
        const desired=eyeBox.getCenter(new THREE.Vector3());
        desired.z=eyeBox.min.z+(eyeBox.max.z-eyeBox.min.z)*0.76;
        let nearest=Infinity;
        for(let i=0;i<positions.count;i++) {
          const p=new THREE.Vector3().fromBufferAttribute(positions,i);
          const d=(p.y-desired.y)**2+(p.z-desired.z)**2;
          if(d<nearest){nearest=d;object.userData.pupilVertex=i;}
        }
        let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
        for (let i=0;i<uv.count;i++) {
          u0=Math.min(u0,uv.getX(i)); u1=Math.max(u1,uv.getX(i));
          v0=Math.min(v0,uv.getY(i)); v1=Math.max(v1,uv.getY(i));
        }
        texture.repeat.set(1/(u1-u0),1/(v1-v0));
        texture.offset.set(-u0/(u1-u0),-v0/(v1-v0));
        object.material = new THREE.MeshBasicMaterial({map:texture, side:THREE.DoubleSide});
        object.userData.beautyMaterial = object.material;
        return;
      }
      if (object.material) {
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        for (const material of materials) {
          material.side = THREE.DoubleSide;
          material.vertexColors = false;
          material.color.set(0xffffff);
          material.metalness = 0;
          material.roughness = 1;
          if (material.map) {
            material.emissive.set(0xffffff);
            material.emissiveMap = material.map;
            material.emissiveIntensity = settings.emissive_intensity ?? 0.85;
          }
          material.needsUpdate = true;
        }
      }
      if (nativeEyeSource?.texture_slots?.InnerGrowAValue) {
        const source = nativeEyeTextures.get(nativeEyeSource.texture_indices.InnerGrowAValue);
        const mask = nativeEyeTextures.get(nativeEyeSource.texture_indices.OverlayMaskSampler);
        if (!source || !mask || !object.geometry.attributes.sourceEyeOpacity)
          throw new Error('Native eye shine requires source atlas, green crop mask and vertex alpha');
        const canvas=document.createElement('canvas');canvas.width=source.image.width;canvas.height=source.image.height;
        const ctx=canvas.getContext('2d');ctx.drawImage(source.image,0,0);
        const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
        for(let i=0;i<pixels.data.length;i+=4){const a=pixels.data[i+3];pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=a;pixels.data[i+3]=255;}
        ctx.putImageData(pixels,0,0);
        const shine=new THREE.CanvasTexture(canvas);shine.flipY=false;shine.colorSpace=THREE.NoColorSpace;
        const crop=mask.clone();crop.channel=0;crop.colorSpace=THREE.NoColorSpace;
        if (settings.native_eye_expression_offsets)
          object.userData.nativeExpressionMaps=[{map:crop,base:crop.offset.toArray()}];
        const material=new THREE.MeshMatcapMaterial({matcap:shine,alphaMap:crop,
          transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
        material.onBeforeCompile=shader=>{
          shader.vertexShader='attribute float sourceEyeOpacity;\nvarying float vSourceEyeOpacity;\n'+shader.vertexShader;
          shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvSourceEyeOpacity=sourceEyeOpacity;');
          shader.fragmentShader='varying float vSourceEyeOpacity;\n'+shader.fragmentShader;
          shader.fragmentShader=shader.fragmentShader.replace('#include <alphamap_fragment>','#include <alphamap_fragment>\ndiffuseColor.a *= vSourceEyeOpacity;');
        };
        material.customProgramCacheKey=()=> 'native-eye-shine-v1';
        object.material=material;
      } else if (nativeEyeSource?.texture_slots?.OverlayColorSampler3 && nativeEyeSource?.texture_slots?.OverlayNormalSampler) {
        // b01 is face/sclera on UV3; p01 is the source iris on UV2 despite
        // the historical OverlayNormalSampler slot name. b01m.G gates it.
        const iris=nativeEyeTextures.get(nativeEyeSource.texture_indices.OverlayNormalSampler)?.clone();
        const mask=nativeEyeTextures.get(nativeEyeSource.texture_indices.OverlayMaskSampler3)?.clone();
        if (!iris || !mask || !object.geometry.attributes.uv1)
          throw new Error('Native eye overlay requires source iris, green mask and UV2');
        iris.colorSpace=THREE.SRGBColorSpace;mask.colorSpace=THREE.NoColorSpace;
        object.material=object.material.clone();
        if (settings.native_eye_expression_offsets) {
          object.material.map=object.material.map.clone();
          object.material.emissiveMap=object.material.map;
          object.userData.nativeExpressionMaps=[{map:object.material.map,base:object.material.map.offset.toArray()}];
        }
        object.material.onBeforeCompile=shader=>{
          shader.uniforms.nativeIris={value:iris};shader.uniforms.nativeIrisMask={value:mask};
          shader.vertexShader='#ifndef USE_UV1\nattribute vec2 uv1;\n#endif\nvarying vec2 vNativeIrisUV;\n'+shader.vertexShader;
          shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvNativeIrisUV=uv1;');
          shader.fragmentShader='uniform sampler2D nativeIris;\nuniform sampler2D nativeIrisMask;\nvarying vec2 vNativeIrisUV;\n'+shader.fragmentShader;
          shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
            vec4 nativeIrisColor=texture2D(nativeIris,vNativeIrisUV);
            float nativeShow=texture2D(nativeIrisMask,vMapUv).g*nativeIrisColor.a;
            vec3 nativeFace=mix(texture2D(map,vMapUv).rgb,nativeIrisColor.rgb,nativeShow);
            diffuseColor.rgb=diffuse*nativeFace;`);
          shader.fragmentShader=shader.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
            totalEmissiveRadiance=emissive*nativeFace;`);
        };
        object.material.customProgramCacheKey=()=> 'native-eye-overlay-v1';
      }
      object.userData.beautyMaterial = object.material;
    }
  });
  scene.add(model);
  window.renderNext = async request => {
    size = Number(request.size);
    pixelSize = Number(request.pixels);
    azimuth = Number(request.azimuth) * Math.PI / 180;
    time = Number(request.time);
    clipName = request.clip;
    renderer.setSize(size, size, false);
    await finish(model, gltf.animations || []);
    return true;
  };
  if (params.get('batch') === '1') document.documentElement.dataset.ready = 'true';
  else finish(model, gltf.animations || []).then(() => { document.documentElement.dataset.ready = 'true'; }).catch(fail);
}, undefined, error => {
  document.documentElement.dataset.error = String(error);
  console.error(error);
  fail(error);
});
</script>
</body>
